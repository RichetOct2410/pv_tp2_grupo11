<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 18</title>
</head>
<body>

<script>
  let num1 = parseInt(prompt("Ingrese el numero 1: "));
  while(isNaN(num1)){
    num1 = parseInt(prompt("Ingrese un numero valido"));
  }
  let num2 = parseInt(prompt("Ingrese el numero 2: "));
  while(isNaN(num2)){
    num2 = parseInt(prompt("Ingrese un numero valido"));
  }
  const comparar = (num1, num2) => {
    if (num1 > num2){
        return `El numero mayor es: ${num1}`;}
        else{
            if( num1 < num2){
                return `El numero mayor es: ${num2}`;}
                else{
                    return `Ambos numeros son iguales.`;}
        }
  }
  let resultado = comparar(num1, num2);
  document.write(`
    <h2>Mayor, menor o igual</h2>
    <p>${resultado}</p>`);

</script>

</body>
</html>
